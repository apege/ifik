<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Dark ribbon frame border -->
  <path d="M 0 0 H 72 V 72 H 0 Z M 20 20 V 52 H 52 V 20 Z" fill="#18181b"/>
  
  <!-- Outer and inner border lines -->
  <rect x="0.75" y="0.75" width="70.5" height="70.5" rx="3" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="20" y="20" width="32" height="32" fill="none" stroke="#ea580c" stroke-width="1.5"/>

  <!-- Geometric / Diamond / Zigzag Motif -->
  <g fill="#ea580c" stroke="#f97316" stroke-width="1">
    <!-- Top diamonds -->
    <polygon points="12,5 18,12 12,19 6,12"/>
    <polygon points="36,5 42,12 36,19 30,12"/>
    <polygon points="60,5 66,12 60,19 54,12"/>

    <!-- Sides diamonds -->
    <polygon points="12,29 18,36 12,43 6,36"/>
    <polygon points="60,29 66,36 60,43 54,36"/>

    <!-- Bottom diamonds -->
    <polygon points="12,53 18,60 12,67 6,60"/>
    <polygon points="36,53 42,60 36,67 30,60"/>
    <polygon points="60,53 66,60 60,67 54,60"/>
  </g>
</svg>
